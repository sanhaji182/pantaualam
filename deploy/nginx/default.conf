# =============================================================================
# KONFIGURASI REVERSE PROXY NGINX
# Proyek: PantauAlam — Disaster & Climate Monitor
# Kesesuaian Silabus: Modul 17 — Basic Networking & Modul 12 — Cloud Computing
# =============================================================================

server {
    listen 80;
    server_name localhost;

    # Header Keamanan Standar Industri
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 1. Routing Endpoint REST API ke Core Gateway Golang (Port 8080)
    location /api/ {
        # Teruskan request ke container gateway di jaringan internal docker
        proxy_pass http://gateway:8080/api/;
        proxy_http_version 1.1;

        # Menyertakan IP asli pengguna untuk pencatatan log
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Batas waktu timeout koneksi
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # 2. Routing Health Check
    location /health {
        proxy_pass http://gateway:8080/health;
        proxy_set_header Host $host;
    }

    # 3. File HTML utama (Jangan dicache agar pengguna selalu memuat versi bundle terbaru)
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 4. Aset statis terkompilasi Vite dengan hash unik (Cache aman 1 tahun)
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 5. Menyajikan File Statis Frontend Web Dashboard (React JS Production Build)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Single Page Application (SPA): Jika rute tidak ditemukan, fallback ke index.html
        try_files $uri $uri/ /index.html;
    }

    # Halaman Error Default
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
